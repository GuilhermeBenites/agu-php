security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        public_auth:
            pattern: ^/api/(health|login|register)$
            security: false
        api:
            pattern: ^/api(?:/|$)
            stateless: true
            provider: app_user_provider
            entry_point: App\Security\ApiAuthenticationEntryPoint
            jwt: ~
    access_control:
        - { path: ^/api, methods: [OPTIONS], roles: PUBLIC_ACCESS }
        - { path: ^/api/(health|login|register)$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
