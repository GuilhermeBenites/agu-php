name: agu-backend

services:
  backend:
    build: ./backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql_db:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  mysql_db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: agu
      MYSQL_USER: agu
      MYSQL_PASSWORD: agu
      MYSQL_ROOT_PASSWORD: local-development-only
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' $$MYSQL_DATABASE >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 15

  redis_test:
    image: redis:7.4-alpine
    profiles: [test]
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 15

  mysql_test:
    image: mysql:8.0
    profiles: [test]
    environment:
      MYSQL_DATABASE: agu_test
      MYSQL_USER: agu_test
      MYSQL_PASSWORD: agu_test
      MYSQL_ROOT_PASSWORD: local-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysql -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1' $$MYSQL_DATABASE >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  mysql_data:
